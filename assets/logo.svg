<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background subtle radial for standalone view -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </radialGradient>

    <!-- Thunder Yellow Gradient -->
    <linearGradient id="thunderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF466"/>
      <stop offset="35%" stop-color="#FFC700"/>
      <stop offset="85%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#E58500"/>
    </linearGradient>

    <!-- Speed Streaks Yellow -->
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA800" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FFC700" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFF466" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Truck Body Gradient -->
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="50%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>

    <!-- Chrome Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <g transform="translate(10, -20)">
    <!-- Speed streaks behind truck -->
    <path d="M140 230 L360 230 L330 242 L110 242 Z" fill="url(#streakGrad)"/>
    <path d="M190 200 L380 200 L355 210 L165 210 Z" fill="url(#streakGrad)"/>
    <path d="M230 170 L400 170 L380 178 L210 178 Z" fill="url(#streakGrad)"/>
    <path d="M180 260 L330 260 L310 269 L160 269 Z" fill="url(#streakGrad)"/>

    <!-- Dark speed cuts inside truck body -->
    <path d="M380 185 L530 185 C538 185 545 192 545 200 V235 H585 L635 285 V335 C635 342 630 348 622 348 H590 C590 325 568 310 545 310 C522 310 500 325 500 348 H410 C410 325 388 310 365 310 C342 310 320 325 320 348 H290 V230 L380 185 Z" fill="url(#truckBody)" stroke="#5A677D" stroke-width="2"/>

    <!-- Speed slash inlays on truck cargo -->
    <path d="M370 215 L480 215 L445 230 L335 230 Z" fill="#141824" opacity="0.8"/>
    <path d="M360 245 L490 245 L460 258 L330 258 Z" fill="#141824" opacity="0.8"/>
    <path d="M350 275 L470 275 L445 287 L325 287 Z" fill="#141824" opacity="0.8"/>

    <!-- Truck Window -->
    <path d="M550 242 H585 L618 280 H550 V242 Z" fill="#0D111A" stroke="#FFC700" stroke-width="2"/>
    <path d="M560 248 H580 L605 275 H560 V248 Z" fill="#1F293D" opacity="0.6"/>

    <!-- Headlight -->
    <path d="M632 295 L636 295 L636 308 L630 308 Z" fill="#FFC700" filter="url(#boltGlow)"/>

    <!-- Truck Wheels -->
    <!-- Rear Wheel -->
    <circle cx="365" cy="348" r="32" fill="#0A0D14" stroke="#4A5568" stroke-width="8"/>
    <circle cx="365" cy="348" r="14" fill="#1A202C"/>
    <circle cx="365" cy="348" r="6" fill="#FFC700"/>
    <!-- Front Wheel -->
    <circle cx="545" cy="348" r="32" fill="#0A0D14" stroke="#4A5568" stroke-width="8"/>
    <circle cx="545" cy="348" r="14" fill="#1A202C"/>
    <circle cx="545" cy="348" r="6" fill="#FFC700"/>

    <!-- MAIN LIGHTNING BOLT - Electric Yellow Bold Design -->
    <path d="M260 145 L490 145 L360 260 L445 260 L240 395 L295 285 L210 285 L260 145 Z" fill="url(#thunderGrad)" filter="url(#boltGlow)"/>
    <!-- Lightning Core Highlight -->
    <path d="M280 155 L465 155 L355 250 L425 250 L260 365 L295 280 L230 280 L280 155 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- TYPOGRAPHY: THUNDER EXPRESS -->
  <g transform="translate(400, 445)" text-anchor="middle">
    <!-- THUNDER -->
    <text x="0" y="0" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="6" fill="url(#textGrad)" stroke="#111520" stroke-width="2" style="text-transform: uppercase;">
      THUNDER
    </text>

    <!-- Side wings / accents for EXPRESS -->
    <path d="M-280 40 L-180 40 L-190 46 L-290 46 Z" fill="#FFC700"/>
    <path d="M180 40 L280 40 L290 46 L190 46 Z" fill="#FFC700"/>

    <!-- EXPRESS -->
    <text x="0" y="46" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="14" fill="#FFC700" filter="url(#boltGlow)" style="text-transform: uppercase;">
      EXPRESS
    </text>

    <!-- FASTEST WAY. EVERY TIME. -->
    <text x="0" y="85" font-family="'Outfit', 'Tajawal', sans-serif" font-weight="700" font-size="16" letter-spacing="7" fill="#CBD5E1" opacity="0.9" style="text-transform: uppercase;">
      FASTEST WAY. EVERY TIME.
    </text>
  </g>
</svg>
